version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: ai-connector
    main: ./cmd/ai-connector
    binary: ai-connector
    env:
      - CGO_ENABLED=0
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [ai-connector]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

source:
  enabled: true

changelog:
  sort: asc
