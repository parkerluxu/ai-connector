version: 2

before:
  hooks:
    - go test ./...

builds:
  - id: ai-connector
    main: ./cmd/ai-connector
    binary: ai-connector
    env:
      - CGO_ENABLED=0
    goos: [windows, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # Publish each platform binary as a direct Release asset rather than nesting
  # it in an archive, so a user can download the exact executable they need.
  - id: standalone-binaries
    ids: [ai-connector]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

source:
  enabled: true

changelog:
  sort: asc
